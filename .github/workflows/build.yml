name: Last Signal Builds

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  web:
    name: Build Web
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot

          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              ~/.local/share/godot/export_templates/
          fi

          if [ -d "/root/.config/godot" ]; then
            cp -r /root/.config/godot/* ~/.config/godot/ || true
          fi

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Build Web
        run: |
          mkdir -p build/web
          godot --headless \
            --path . \
            --export-release "Web" \
            build/web/index.html

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: last-signal-web
          path: build/web

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    name: Deploy Web to GitHub Pages
    needs: web
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot

          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              ~/.local/share/godot/export_templates/
          fi

          if [ -d "/root/.config/godot" ]; then
            cp -r /root/.config/godot/* ~/.config/godot/ || true
          fi

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/android/LastSignal-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: last-signal-android
          path: build/android/LastSignal-debug.apk

